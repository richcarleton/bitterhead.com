<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bitterhead.com</title>
<style>
  /* ============ FLAT CARTOON PALETTE ============ */
  :root {
    --ink: #1b0a2e;
    --cream: #fff4d6;
    --yellow: #ffd23f;
    --pink: #ff4fa3;
    --cyan: #2ee6d6;
    --orange: #ff7a1a;
    --purple: #7b2cff;
    --lime: #a6ff3d;
    --red: #ff3b3b;
  }
  @property --r { syntax: '<length>'; inherits: false; initial-value: 0px; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--ink);
    color: var(--cream);
    font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif;
  }

  /* ============ THE WORLD (everything that can be warped) ============ */
  #world {
    position: fixed;
    inset: 0;
    overflow: hidden;
    animation: hue 30s linear infinite;
  }
  #world.trip { animation-duration: 1.4s; }
  @keyframes hue { to { filter: hue-rotate(360deg); } }
  #world.mirror { transform: scaleX(-1); }
  #world.roll  { animation: hue 30s linear infinite, roll 1.8s ease-in-out; }
  #world.trip.roll { animation: hue 1.4s linear infinite, roll 1.8s ease-in-out; }
  @keyframes roll { 0% { rotate: 0deg; scale: 1; } 50% { rotate: 180deg; scale: 1.6; } 100% { rotate: 360deg; scale: 1; } }
  #world.shake { translate: 0 0; animation: hue 30s linear infinite, shake .5s steps(2) ; }
  @keyframes shake {
    0%   { translate: 0 0; } 20% { translate: -14px 8px; } 40% { translate: 12px -10px; }
    60%  { translate: -10px -6px; } 80% { translate: 9px 10px; } 100% { translate: 0 0; }
  }
  #world.zoom { animation: hue 30s linear infinite, zoom .7s ease-out; }
  @keyframes zoom { 0% { scale: 1; } 30% { scale: 1.25; } 100% { scale: 1; } }
  #world.glitch { animation: hue 30s linear infinite, glitch .45s steps(1); }
  @keyframes glitch {
    0% { translate: 0 0; transform: skewX(0); } 15% { translate: 30px 0; transform: skewX(12deg); }
    30% { translate: -40px 6px; transform: skewX(-18deg); } 45% { translate: 20px -8px; transform: skewX(6deg); }
    60% { translate: -10px 0; transform: skewX(-4deg); } 100% { translate: 0 0; transform: skewX(0); }
  }
  #world.melt { animation: hue 30s linear infinite, melt 2.6s ease-in-out; }
  @keyframes melt {
    0%,100% { transform: scale(1,1) skew(0,0); }
    25% { transform: scale(1.05,.9) skew(6deg,2deg); }
    50% { transform: scale(.92,1.12) skew(-8deg,-3deg); }
    75% { transform: scale(1.08,.95) skew(4deg,2deg); }
  }

  /* ---- hallucination backdrop ---- */
  .sunburst {
    position: absolute;
    inset: -60%;
    background: repeating-conic-gradient(from 0deg at 50% 50%, #2a0f55 0 6deg, #43178a 6deg 12deg);
    animation: spin 70s linear infinite;
  }
  .sunburst.two {
    background: repeating-conic-gradient(from 0deg at 50% 50%, transparent 0 20deg, rgba(255,79,163,.22) 20deg 30deg);
    animation: spin 40s linear infinite reverse;
  }
  @keyframes spin { to { rotate: 360deg; } }
  .rings {
    position: absolute;
    inset: 0;
    background: repeating-radial-gradient(circle at 50% 58%,
      rgba(255,210,63,0) calc(var(--r) + 0px), rgba(255,210,63,0) calc(var(--r) + 50px),
      rgba(46,230,214,.22) calc(var(--r) + 50px), rgba(46,230,214,.22) calc(var(--r) + 100px));
    animation: ringOut 3s linear infinite;
  }
  @keyframes ringOut { to { --r: 100px; } }
  canvas#space { position: absolute; inset: 0; }

  #bobTitan {
    position: absolute;
    bottom: -4vh;
    left: 50%;
    height: 92vh;
    transform: translateX(-50%) scale(0.92);
    filter: invert(1) drop-shadow(10px 10px 0 var(--pink));
    opacity: 0;
    pointer-events: none;
    animation: titanRise 19s ease-in-out infinite;
  }
  @keyframes titanRise {
    0%   { opacity: 0;    transform: translateX(-50%) scale(0.8) translateY(40px) rotate(-4deg); }
    18%  { opacity: 0.9;  transform: translateX(-50%) scale(0.95) translateY(0) rotate(0); }
    30%  { transform: translateX(-50%) scale(0.97) translateY(-8px) rotate(2deg); }
    45%  { transform: translateX(-50%) scale(0.96) translateY(4px) rotate(-2deg); }
    70%  { opacity: 0.9;  transform: translateX(-50%) scale(0.98) translateY(-6px) rotate(1deg); }
    92%  { opacity: 0;    transform: translateX(-50%) scale(0.88) translateY(30px) rotate(5deg); }
    100% { opacity: 0; }
  }

  .stage {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  /* ============ TICKERS ============ */
  .ticker {
    position: relative;
    overflow: hidden;
    white-space: nowrap;
    font-weight: 900;
    letter-spacing: 1px;
    border-style: solid;
    border-color: var(--ink);
    font-size: clamp(11px, 1.6vw, 17px);
    padding: 6px 0;
    z-index: 3;
  }
  .ticker .track { display: inline-block; padding-left: 100%; will-change: transform; }
  .ticker.top { background: var(--red); color: var(--cream); border-width: 0 0 5px 0; }
  .ticker.top .track { animation: scrollL 18s linear infinite; }
  .ticker.bottom { background: var(--yellow); color: var(--ink); border-width: 5px 0 0 0; }
  .ticker.bottom .track { animation: scrollR 14s linear infinite; }
  @keyframes scrollL { from { transform: translateX(0); } to { transform: translateX(-200%); } }
  @keyframes scrollR { from { transform: translateX(-200%); } to { transform: translateX(0); } }

  .side {
    position: absolute;
    top: 48px;
    bottom: 48px;
    width: 34px;
    overflow: hidden;
    z-index: 3;
    background: var(--cyan);
    border: 0 solid var(--ink);
  }
  .side.left { left: 0; border-right-width: 5px; }
  .side.right { right: 0; border-left-width: 5px; background: var(--lime); }
  .side .track {
    writing-mode: vertical-rl;
    color: var(--ink);
    font-weight: 900;
    font-size: 13px;
    letter-spacing: 2px;
    display: inline-block;
    padding-top: 100%;
  }
  .side.left .track { animation: scrollUp 22s linear infinite; }
  .side.right .track { animation: scrollDown 26s linear infinite; }
  @keyframes scrollUp { from { transform: translateY(0); } to { transform: translateY(-200%); } }
  @keyframes scrollDown { from { transform: translateY(-200%); } to { transform: translateY(0); } }

  /* ============ BANNER ============ */
  .banner { text-align: center; padding: 10px 0 0; position: relative; z-index: 3; }
  .banner h1 {
    margin: 0;
    font-size: clamp(1.3rem, 4vw, 2.7rem);
    font-weight: 900;
    letter-spacing: 2px;
    -webkit-text-stroke: 2px var(--ink);
    paint-order: stroke fill;
    text-shadow: 4px 4px 0 var(--ink);
  }
  .banner h1 .ch { display: inline-block; animation: wave 1.4s ease-in-out infinite; }
  @keyframes wave {
    0%,100% { transform: translateY(0) rotate(-3deg); }
    50%     { transform: translateY(-9px) rotate(4deg) scale(1.08); }
  }
  .live {
    display: inline-block;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--red);
    border: 3px solid var(--ink);
    margin-right: 10px;
    animation: blink 1s steps(2) infinite;
    vertical-align: middle;
  }
  @keyframes blink { 50% { background: var(--cream); } }
  .tagline {
    display: inline-block;
    margin-top: 6px;
    background: var(--ink);
    color: var(--yellow);
    font-weight: 900;
    font-size: 11px;
    letter-spacing: 3px;
    padding: 3px 12px;
    border-radius: 99px;
    transform: rotate(-1.5deg);
    animation: tilt 3s ease-in-out infinite;
  }
  @keyframes tilt { 50% { transform: rotate(1.5deg) scale(1.05); } }

  /* ============ DESK + ANCHORS ============ */
  .desk {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3vw;
    padding: 20px 60px 0;
  }
  .deskTop {
    position: absolute;
    left: 6%; right: 6%;
    bottom: 12px;
    height: 70px;
    background:
      repeating-linear-gradient(135deg, var(--purple) 0 18px, #5d17d6 18px 36px);
    border: 5px solid var(--ink);
    border-radius: 18px 18px 8px 8px;
    box-shadow: 0 8px 0 var(--ink);
    z-index: 0;
  }
  .deskTop .badge {
    position: absolute;
    left: 50%; top: 50%;
    width: 64px; height: 64px;
    margin: -32px 0 0 -32px;
    background: var(--yellow);
    border: 5px solid var(--ink);
    clip-path: none;
    border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 900; font-size: 18px; color: var(--ink);
    animation: spin 5s linear infinite;
  }
  .anchor {
    position: relative;
    z-index: 1;
    text-align: center;
    perspective: 700px;
    animation: 19s ease-in-out infinite;
    margin-bottom: 30px;
  }
  .anchor.cyan { animation-name: dodgeL; }
  .anchor.magenta { animation-name: dodgeR; }
  @keyframes dodgeL {
    0%, 15%   { translate: 0 0; }
    24%, 64%  { translate: -30vw 0; }
    85%, 100% { translate: 0 0; }
  }
  @keyframes dodgeR {
    0%, 15%   { translate: 0 0; }
    24%, 64%  { translate: 30vw 0; }
    85%, 100% { translate: 0 0; }
  }
  .fig {
    display: block;
    width: clamp(140px, 19vw, 250px);
    height: auto;
    margin: 0 auto 8px;
    overflow: visible;
    filter: url(#wob);
  }
  .anchor.cyan .fig    { animation: bob 2.6s ease-in-out infinite, faceL 19s ease-in-out infinite; }
  .anchor.magenta .fig { animation: bob 2.9s ease-in-out infinite, faceR 19s ease-in-out infinite; }
  @keyframes bob { 0%,100% { translate: 0 0; } 50% { translate: 0 -10px; } }
  @keyframes faceL {
    0%, 15%   { rotate: y -26deg; }
    20%       { rotate: y -80deg; }
    24%, 64%  { rotate: y -95deg; }
    80%       { rotate: y -80deg; }
    85%, 100% { rotate: y -26deg; }
  }
  @keyframes faceR {
    0%, 15%   { rotate: y 26deg; }
    20%       { rotate: y 80deg; }
    24%, 64%  { rotate: y 95deg; }
    80%       { rotate: y 80deg; }
    85%, 100% { rotate: y 26deg; }
  }
  .fig * { stroke-linejoin: round; stroke-linecap: round; }
  .ink { stroke: var(--ink); stroke-width: 6; }

  /* anchor part animations */
  .mouth { transform-box: view-box; animation: talk 0.32s ease-in-out infinite; }
  .xr .mouth { transform-origin: 100px 138px; }
  .gl .mouth { transform-origin: 100px 112px; }
  @keyframes talk { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1.05); } }
  .ant1 { transform-origin: 62px 40px; animation: wig 1.3s ease-in-out infinite; }
  .ant2 { transform-origin: 138px 40px; animation: wig 1.1s ease-in-out infinite reverse; }
  @keyframes wig { 0%,100% { transform: rotate(-14deg); } 50% { transform: rotate(16deg); } }
  .stalk1 { transform-origin: 70px 22px; animation: wig 1.7s ease-in-out infinite; }
  .stalk2 { transform-origin: 130px 22px; animation: wig 1.5s ease-in-out infinite reverse; }
  .tent { transform-origin: top center; transform-box: fill-box; animation: sway 1.6s ease-in-out infinite; }
  .tent:nth-child(2) { animation-delay: -.3s; } .tent:nth-child(3) { animation-delay: -.6s; }
  .tent:nth-child(4) { animation-delay: -.9s; } .tent:nth-child(5) { animation-delay: -1.2s; }
  @keyframes sway { 0%,100% { transform: skewX(-9deg) scaleY(1); } 50% { transform: skewX(9deg) scaleY(1.08); } }
  .crest { transform-origin: 100px 22px; animation: crestPulse .9s ease-in-out infinite; }
  @keyframes crestPulse { 50% { transform: scale(1.1, 1.18); } }
  .blinkable { transform-box: fill-box; transform-origin: center; animation: blinkEye 5s infinite; }
  @keyframes blinkEye { 0%,94%,100% { transform: scaleY(1); } 97% { transform: scaleY(.08); } }
  .pupil { transition: transform .12s linear; }

  .nameplate {
    color: var(--ink);
    font-size: 12px;
    font-weight: 900;
    padding: 4px 14px;
    border-radius: 6px;
    display: inline-block;
    letter-spacing: 2px;
    border: 4px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
  }
  .anchor.cyan .nameplate { background: var(--cyan); }
  .anchor.magenta .nameplate { background: var(--pink); }

  .bubble {
    position: absolute;
    left: 50%;
    bottom: calc(100% - 10px);
    translate: -50% 0;
    width: max-content;
    max-width: 210px;
    background: var(--cream);
    color: var(--ink);
    border: 4px solid var(--ink);
    border-radius: 18px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 900;
    line-height: 1.2;
    box-shadow: 4px 4px 0 var(--ink);
    z-index: 5;
  }
  .bubble::after {
    content: "";
    position: absolute;
    left: 50%; bottom: -12px;
    width: 16px; height: 16px;
    background: var(--cream);
    border-right: 4px solid var(--ink);
    border-bottom: 4px solid var(--ink);
    rotate: 45deg;
    translate: -50% 0;
  }
  .bubble.pop { animation: bpop .35s cubic-bezier(.3,1.8,.5,1); }
  @keyframes bpop { 0% { scale: .2; } 100% { scale: 1; } }

  /* ============ STICKERS + OVERLAYS ============ */
  .sticker {
    position: fixed;
    z-index: 30;
    pointer-events: none;
    width: 190px; height: 160px;
    margin: -80px 0 0 -95px;
    background: var(--ink);
    --burst: polygon(50% 0, 60% 18%, 78% 6%, 76% 28%, 98% 26%, 86% 46%, 100% 62%, 80% 66%, 86% 90%, 64% 82%, 50% 100%, 38% 82%, 16% 92%, 20% 68%, 0 62%, 14% 46%, 2% 26%, 24% 28%, 22% 6%, 40% 18%);
    clip-path: var(--burst);
    animation: stickerPop 1.7s ease-in-out forwards;
  }
  .sticker i {
    position: absolute; inset: 7px;
    clip-path: var(--burst);
    display: grid; place-items: center;
    font-style: normal; font-weight: 900; font-size: 19px; text-align: center; line-height: 1;
    color: var(--ink);
    padding: 24px;
  }
  @keyframes stickerPop {
    0%   { scale: 0; rotate: -40deg; }
    14%  { scale: 1.25; rotate: 8deg; }
    24%  { scale: 1; rotate: -6deg; }
    80%  { scale: 1.04; rotate: 5deg; }
    100% { scale: 0; rotate: 30deg; }
  }
  #flash { position: fixed; inset: 0; background: #fff; mix-blend-mode: difference; opacity: 0; pointer-events: none; z-index: 50; }
  #flash.go { animation: flashA .5s steps(1) 3; }
  @keyframes flashA { 0% { opacity: 1; } 50% { opacity: 0; } }
  #halftone {
    position: fixed; inset: 0; z-index: 40; pointer-events: none;
    background-image: radial-gradient(rgba(27,10,46,.35) 1.6px, transparent 1.8px);
    background-size: 9px 9px;
    opacity: .55;
    mix-blend-mode: multiply;
  }

  /* ============ CONTROLS ============ */
  .controls {
    position: fixed;
    bottom: 62px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 45;
    background: var(--cream);
    color: var(--ink);
    border: 4px solid var(--ink);
    border-radius: 12px;
    box-shadow: 4px 4px 0 var(--ink);
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    font-weight: 900;
  }
  .controls button {
    background: var(--lime);
    color: var(--ink);
    border: 3px solid var(--ink);
    border-radius: 8px;
    padding: 5px 12px;
    font-weight: 900;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .controls button:active { translate: 3px 3px; box-shadow: none; }
  #nowplaying { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    #world { animation: none; }
    .sunburst, .sunburst.two, .rings { animation-duration: 240s; }
  }
  @media (max-width: 700px) {
    .desk { padding: 20px 40px 0; }
    .side { display: none; }
  }
</style>
</head>
<body>

<!-- wobble filter for that "is the TV breathing?" feeling -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wob" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="3" result="n">
      <animate attributeName="baseFrequency" values="0.012 0.02;0.02 0.012;0.012 0.02" dur="7s" repeatCount="indefinite"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G">
      <animate attributeName="scale" values="4;16;4" dur="4.3s" repeatCount="indefinite"/>
    </feDisplacementMap>
  </filter>
</svg>

<div id="world">
  <div class="sunburst"></div>
  <div class="sunburst two"></div>
  <div class="rings"></div>
  <canvas id="space"></canvas>
  <img id="bobTitan" src="assets/bluegrass-bob.svg" alt="Bluegrass Bob looming over the galactic broadcast">

  <div class="stage">
    <div class="ticker top"><div class="track" id="tickTop"></div></div>

    <div class="banner">
      <h1 id="title"><span class="live"></span><span id="titleText">BZRRK GALACTIC NEWS NETWORK</span></h1>
      <div class="tagline" id="tagline">ALL NEWS • ALL ANGRY • ALL THE TIME</div>
    </div>

    <div class="desk">
      <div class="deskTop"><div class="badge">BGN</div></div>

      <!-- XRRTH PRIME: three-eyed, crested, antennaed -->
      <div class="anchor cyan">
        <div class="bubble" id="bubbleL">...</div>
        <svg class="fig xr" viewBox="0 -24 200 270" aria-hidden="true">
          <!-- suit -->
          <path class="ink" d="M14 246 L28 196 Q100 168 172 196 L186 246 Z" fill="#7b2cff"/>
          <polygon class="ink" points="76,186 100,236 124,186" fill="#fff4d6"/>
          <polygon class="ink" points="100,204 90,220 100,244 110,220" fill="#ffd23f"/>
          <!-- neck -->
          <rect class="ink" x="84" y="158" width="32" height="34" fill="#1fb8aa"/>
          <!-- antennae -->
          <g class="ant1"><line class="ink" x1="62" y1="40" x2="30" y2="-8"/><circle class="ink" cx="28" cy="-12" r="11" fill="#ffd23f"/></g>
          <g class="ant2"><line class="ink" x1="138" y1="40" x2="170" y2="-8"/><circle class="ink" cx="172" cy="-12" r="11" fill="#ff4fa3"/></g>
          <!-- ears -->
          <ellipse class="ink" cx="40" cy="96" rx="13" ry="22" fill="#1fb8aa"/>
          <ellipse class="ink" cx="160" cy="96" rx="13" ry="22" fill="#1fb8aa"/>
          <!-- head -->
          <path class="ink" d="M45 70 Q45 20 100 20 Q155 20 155 70 L148 135 Q140 172 100 174 Q60 172 52 135 Z" fill="#2ee6d6"/>
          <!-- crest -->
          <g class="crest">
            <polygon class="ink" points="66,26 80,-6 96,22" fill="#ff7a1a"/>
            <polygon class="ink" points="90,22 106,-14 122,22" fill="#ffd23f"/>
            <polygon class="ink" points="116,24 134,-4 144,32" fill="#ff7a1a"/>
          </g>
          <!-- cheeks -->
          <circle cx="62" cy="130" r="8" fill="#ff4fa3"/><circle cx="138" cy="130" r="8" fill="#ff4fa3"/>
          <!-- eyes -->
          <g class="blinkable"><circle class="ink" cx="70" cy="90" r="17" fill="#fff"/><circle class="pupil" data-max="7" cx="70" cy="90" r="7.5" fill="#1b0a2e"/></g>
          <g class="blinkable"><circle class="ink" cx="130" cy="90" r="17" fill="#fff"/><circle class="pupil" data-max="7" cx="130" cy="90" r="7.5" fill="#1b0a2e"/></g>
          <g class="blinkable"><circle class="ink" cx="100" cy="54" r="11" fill="#fff"/><circle class="pupil" data-max="4" cx="100" cy="54" r="5" fill="#ff3b3b"/></g>
          <!-- angry brows -->
          <line x1="46" y1="64" x2="92" y2="84" stroke="#1b0a2e" stroke-width="10"/>
          <line x1="154" y1="64" x2="108" y2="84" stroke="#1b0a2e" stroke-width="10"/>
          <!-- mouth -->
          <g class="mouth">
            <path d="M66 138 Q100 124 134 138 Q134 166 100 168 Q66 166 66 138Z" fill="#1b0a2e"/>
            <path d="M70 140 L78 154 L86 139 L94 154 L102 139 L110 154 L118 139 L126 154 L131 141 Q100 130 70 140Z" fill="#fff4d6"/>
            <ellipse cx="100" cy="163" rx="15" ry="6" fill="#ff4fa3"/>
          </g>
        </svg>
        <div class="nameplate">XRRTH PRIME</div>
      </div>

      <!-- GLORB 9: cyclops jellyfish with stalk-eyes and tentacles -->
      <div class="anchor magenta">
        <div class="bubble" id="bubbleR">...</div>
        <svg class="fig gl" viewBox="0 -24 200 270" aria-hidden="true">
          <!-- tentacles -->
          <g>
            <g class="tent"><path class="ink" d="M44 130 q-14 28 0 54 t0 56" fill="none" stroke-width="22" stroke="#1b0a2e"/><path d="M44 130 q-14 28 0 54 t0 56" fill="none" stroke-width="11" stroke="#ff4fa3"/></g>
            <g class="tent"><path d="M72 134 q-12 28 0 56 t0 52" fill="none" stroke-width="22" stroke="#1b0a2e"/><path d="M72 134 q-12 28 0 56 t0 52" fill="none" stroke-width="11" stroke="#ffd23f"/></g>
            <g class="tent"><path d="M100 138 q-12 30 0 58 t0 48" fill="none" stroke-width="22" stroke="#1b0a2e"/><path d="M100 138 q-12 30 0 58 t0 48" fill="none" stroke-width="11" stroke="#ff4fa3"/></g>
            <g class="tent"><path d="M128 134 q12 28 0 56 t0 52" fill="none" stroke-width="22" stroke="#1b0a2e"/><path d="M128 134 q12 28 0 56 t0 52" fill="none" stroke-width="11" stroke="#ffd23f"/></g>

<script>
var INK = '#1b0a2e';
var COLS = ['#ffd23f', '#ff4fa3', '#2ee6d6', '#ff7a1a', '#a6ff3d', '#7b2cff', '#ff3b3b', '#fff4d6'];
function R(a, b) { return a + Math.random() * (b - a); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

// =====================================================================
//  SPACE CANVAS: flat planets, sparkles, UFOs, comets, cheese, eyeballs
// =====================================================================
var space = (function () {
  var c = document.getElementById('space');
  var ctx = c.getContext('2d');
  var W = 0, H = 0, T = 0;
  function size() { W = c.width = innerWidth; H = c.height = innerHeight; }

  var mouse = { x: innerWidth / 2, y: innerHeight / 2 };

  // planets
  var planets = [];
  function makePlanet(i) {
    var r = R(34, 90);

      x: R(0, W), y: R(60, H - 60), r: r, vx: R(-.25, .25) || .1,
      col: pick(COLS), col2: pick(COLS), ring: Math.random() < .5, face: Math.random() < .6,

  for (var i = 0; i < 7; i++) planets.push(makePlanet(i));
  function drawPlanet(p) {
    var y = p.y + Math.sin(T * .02 + p.ph) * 10;

    ctx.globalAlpha = .45; ctx.fillStyle = '#ffd23f'; ctx.fill(); ctx.globalAlpha = 1;

  function comet(s) {

  function cheese(s) {

    ctx.beginPath(); ctx.moveTo(-34, 22); ctx.lineTo(34, 22); ctx.lineTo(34, -6); ctx.closePath(); outline('#ffd23f', 5);

    ctx.beginPath(); ctx.arc(Math.cos(ang) * s.r * .45, Math.sin(ang) * s.r * .45, s.r * .24, 0, 6.3); ctx.fillStyle = INK; ctx.fill();

  function bit(s) {
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot);

    ufo: function () {
      var dir = Math.random() < .5 ? 1 : -1;

    cheese: function () {

    eyes: function () {

    asteroids: function () {
      for (var i = 0; i < 8; i++) add({ draw: function (s) {
        ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(T * s.spin);
        ctx.beginPath();
        for (var k = 0; k < 7; k++) { var a = k / 7 * 6.28, rr = s.r * (.75 + ((k * 37) % 5) / 14); ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }

    }
  };

  function frame() {
    T++;
    ctx.clearRect(0, 0, W, H);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';

      s.p += s.v;
      var k = .5 + .5 * Math.abs(Math.sin(s.p));

      p.x += p.vx;

      if (p.x < -p.r * 2) p.x = W + p.r * 2;

    });
    for (var i = sprites.length - 1; i >= 0; i--) {
      var s = sprites[i];
      s.x += s.vx; s.y += s.vy;
      if (s.g) s.vy += s.g;
      if (s.vr) s.rot += s.vr;

      var gone = s.life ? --s.life <= 0 : (s.x < -250 || s.x > W + 250 || s.y < -250 || s.y > H + 250);

    }
    requestAnimationFrame(frame);
  }
  frame();
  return spawn;
})();

var current = Math.floor(Math.random() * PLAYLIST.length);

function tuneIn(midSong) {
  var track = PLAYLIST[current];
  radio.src = track.src;
  nowplaying.textContent = radio.muted ? "signal muted" : "NOW PLAYING: " + track.title;
  radio.addEventListener('loadedmetadata', function onMeta() {
    if (midSong && radio.duration) {
      radio.currentTime = radio.duration * (0.25 + Math.random() * 0.5);
    }
    radio.removeEventListener('loadedmetadata', onMeta);
  });
  radio.play().catch(function () {});
}
radio.addEventListener('ended', function () {
  current = (current + 1) % PLAYLIST.length;
  tuneIn(false);
});
tuneIn(true);

muteBtn.addEventListener('click', function () {
  radio.muted = !radio.muted;
  muteBtn.textContent = radio.muted ? "UNMUTE" : "MUTE";
  nowplaying.textContent = radio.muted ? "signal muted" : "NOW PLAYING: " + PLAYLIST[current].title;
  if (!radio.muted && radio.paused) radio.play().catch(function () {});
});
</script>
</body>
</html>
