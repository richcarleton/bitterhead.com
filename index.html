<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bitterhead.com</title>
<style>
  :root {
    --bg: #05030a;
    --panel: #1a0f1f;
    --hot: #ff2d55;
    --hot2: #ff9f1c;
    --alien: #39ff8f;
    --text: #f2e9ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: "Courier New", monospace;
  }
  canvas#stars {
    position: fixed;
    inset: 0;
    z-index: 0;
  }
  .stage {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---- tickers ---- */
  .ticker {
    position: relative;
    overflow: hidden;
    white-space: nowrap;
    font-weight: bold;
    letter-spacing: 1px;
  }
  .ticker .track {
    display: inline-block;
    padding-left: 100%;
    will-change: transform;
  }
  .ticker.top {
    background: linear-gradient(90deg, var(--hot), #7a0030);
    color: #fff;
    font-size: clamp(10px, 1.6vw, 16px);
    padding: 6px 0;
  }
  .ticker.top .track { animation: scrollL 18s linear infinite; }

  .ticker.bottom {
    background: linear-gradient(90deg, var(--hot2), #7a3b00);
    color: #130900;
    font-size: clamp(10px, 1.6vw, 16px);
    padding: 6px 0;
  }
  .ticker.bottom .track { animation: scrollR 14s linear infinite; }

  @keyframes scrollL { from { transform: translateX(0); } to { transform: translateX(-200%); } }
  @keyframes scrollR { from { transform: translateX(-200%); } to { transform: translateX(0); } }

  .side {
    position: fixed;
    top: 48px;
    bottom: 48px;
    width: 34px;
    overflow: hidden;
    z-index: 2;
    background: rgba(57,255,143,0.08);
    border-left: 1px solid rgba(57,255,143,0.3);
    border-right: 1px solid rgba(57,255,143,0.3);
  }
  .side.left { left: 0; }
  .side.right { right: 0; }
  .side .track {
    writing-mode: vertical-rl;
    color: var(--alien);
    font-size: 13px;
    letter-spacing: 2px;
    display: inline-block;
    padding-top: 100%;
  }
  .side.left .track { animation: scrollUp 22s linear infinite; }
  .side.right .track { animation: scrollDown 26s linear infinite; }
  @keyframes scrollUp { from { transform: translateY(0); } to { transform: translateY(-200%); } }
  @keyframes scrollDown { from { transform: translateY(-200%); } to { transform: translateY(0); } }

  /* ---- center stage ---- */
  .desk {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6vw;
    padding: 0 60px;
  }
  .anchor { text-align: center; }
  .head {
    width: clamp(70px, 10vw, 120px);
    height: clamp(70px, 10vw, 120px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffd9a0, #c9863f);
    margin: 0 auto 10px;
    position: relative;
    box-shadow: 0 0 30px rgba(255,45,85,0.4);
  }
  .brow {
    position: absolute;
    top: 28%;
    width: 36%;
    height: 10px;
    background: #2a1200;
    border-radius: 4px;
  }
  .brow.l { left: 10%; animation: angryL 0.9s ease-in-out infinite; }
  .brow.r { right: 10%; animation: angryR 0.9s ease-in-out infinite; }
  @keyframes angryL { 0%,100% { transform: rotate(18deg) translateY(0); } 50% { transform: rotate(26deg) translateY(-2px); } }
  @keyframes angryR { 0%,100% { transform: rotate(-18deg) translateY(0); } 50% { transform: rotate(-26deg) translateY(-2px); } }
  .eye {
    position: absolute;
    top: 42%;
    width: 10px;
    height: 10px;
    background: #1a0f1f;
    border-radius: 50%;
  }
  .eye.l { left: 26%; }
  .eye.r { right: 26%; }
  .mouth {
    position: absolute;
    bottom: 20%;
    left: 30%;
    width: 40%;
    height: 8px;
    background: #7a0030;
    border-radius: 6px;
    animation: talk 0.35s ease-in-out infinite;
  }
  @keyframes talk { 0%,100% { height: 4px; } 50% { height: 14px; } }
  .nameplate {
    background: var(--hot);
    color: #fff;
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 3px;
    display: inline-block;
    font-weight: bold;
  }

  .banner {
    text-align: center;
    padding: 10px 0 0;
  }
  .banner h1 {
    margin: 0;
    font-size: clamp(1.4rem, 4vw, 2.6rem);
    color: var(--alien);
    text-shadow: 0 0 12px rgba(57,255,143,0.7);
    letter-spacing: 2px;
  }
  .live {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--hot);
    margin-right: 8px;
    animation: blink 1s steps(2) infinite;
    vertical-align: middle;
  }
  @keyframes blink { 50% { opacity: 0.1; } }

  /* ---- controls ---- */
  .controls {
    position: fixed;
    bottom: 56px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    background: rgba(26,15,31,0.85);
    border: 1px solid var(--alien);
    border-radius: 10px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
  }
  .controls button {
    background: var(--alien);
    color: #05030a;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
  }
  .controls button:hover { background: #8dffc0; }
  #nowplaying { color: var(--hot2); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="stage">
  <div class="ticker top"><div class="track" id="tickTop"></div></div>

  <div class="banner">
    <h1><span class="live"></span>BZRRK GALACTIC NEWS NETWORK</h1>
  </div>

  <div class="desk">
    <div class="anchor">
      <div class="head">
        <div class="brow l"></div><div class="brow r"></div>
        <div class="eye l"></div><div class="eye r"></div>
        <div class="mouth"></div>
      </div>
      <div class="nameplate">XRRTH PRIME</div>
    </div>
    <div class="anchor">
      <div class="head">
        <div class="brow l"></div><div class="brow r"></div>
        <div class="eye l"></div><div class="eye r"></div>
        <div class="mouth" style="animation-delay:0.15s"></div>
      </div>
      <div class="nameplate">GLORB 9</div>
    </div>
  </div>

  <div class="ticker bottom"><div class="track" id="tickBottom"></div></div>
</div>

<div class="side left"><div class="track" id="tickLeft"></div></div>
<div class="side right"><div class="track" id="tickRight"></div></div>

<div class="controls">
  <button id="muteBtn">UNMUTE</button>
  <button id="playBtn">PAUSE</button>
  <span id="nowplaying">signal muted</span>
</div>

<audio id="radio" preload="auto"></audio>

<script>
// ---- starfield ----
(function () {
  var c = document.getElementById('stars');
  var ctx = c.getContext('2d');
  function size() { c.width = innerWidth; c.height = innerHeight; }
  size(); addEventListener('resize', size);
  var stars = Array.from({length: 220}, function () {
    return { x: Math.random() * c.width, y: Math.random() * c.height, r: Math.random() * 1.6 + 0.2, s: Math.random() * 0.02 + 0.005, p: Math.random() * Math.PI * 2 };
  });
  function draw() {
    ctx.fillStyle = '#05030a';
    ctx.fillRect(0, 0, c.width, c.height);
    stars.forEach(function (st) {
      st.p += st.s;
      var a = 0.4 + 0.6 * Math.abs(Math.sin(st.p));
      ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// ---- alien garble headline generator ----
var GLYPHS = "⟁⟂⟄◬◭◮⌬⍟✺✷⟟☣☢⚡⚛✦҈ꙮ𝔅𝔙𝔊ƹƽ";
var PHRASES = [
  "BREAKING: COLONY {N} DEMANDS MORE SPACE CHEESE",
  "ALERT: TRIPLE MOON OF {N} CANCELS GRAVITY FOR LUNCH",
  "DEVELOPING: SENATE OF GLORB VOTES TO OUTLAW SILENCE",
  "URGENT: XRRTH MARKETS CRASH AFTER BAD JOKE",
  "LIVE: WORMHOLE TRAFFIC BACKED UP TO {N} PARSECS",
  "JUST IN: EARTH STILL THINKS IT'S THE CENTER OF THE GALAXY",
  "EXCLUSIVE: ANCHOR GLORB-9 ONCE AGAIN FORGETS TO BLINK",
  "WEATHER: 110% CHANCE OF METEOR SHOWER EMOTIONAL DAMAGE",
  "SPORTS: ZERO-G TUG-OF-WAR ENDS IN THREE-WAY TIE",
  "RUMOR: BITTERHEAD.COM MAY ACTUALLY LAUNCH SOMEDAY"
];
function gibberish(len) {
  var out = "";
  for (var i = 0; i < len; i++) out += GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
  return out;
}
function headline() {
  var p = PHRASES[Math.floor(Math.random() * PHRASES.length)].replace("{N}", Math.floor(Math.random() * 900) + 1);
  return p + "   " + gibberish(6 + Math.floor(Math.random() * 10));
}
function buildFeed(count) {
  var items = [];
  for (var i = 0; i < count; i++) items.push(headline());
  return items.join("   ★   ");
}
function fillTicker(id, count) {
  var el = document.getElementById(id);
  var text = buildFeed(count);
  el.textContent = text + "    " + text; // duplicate for seamless loop
}
fillTicker('tickTop', 6);
fillTicker('tickBottom', 6);
fillTicker('tickLeft', 5);
fillTicker('tickRight', 5);

// ---- radio playlist ----
var PLAYLIST = [
  { title: "SoundHelix Transmission 1", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
  { title: "SoundHelix Transmission 3", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
  { title: "SoundHelix Transmission 5", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3" },
  { title: "SoundHelix Transmission 8", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" }
];
var radio = document.getElementById('radio');
var muteBtn = document.getElementById('muteBtn');
var playBtn = document.getElementById('playBtn');
var nowplaying = document.getElementById('nowplaying');
radio.muted = true;
radio.volume = 0.7;
var current = Math.floor(Math.random() * PLAYLIST.length);

function tuneIn(midSong) {
  var track = PLAYLIST[current];
  radio.src = track.src;
  nowplaying.textContent = "NOW PLAYING: " + track.title;
  radio.addEventListener('loadedmetadata', function onMeta() {
    if (midSong && radio.duration) {
      radio.currentTime = radio.duration * (0.25 + Math.random() * 0.5);
    }
    radio.removeEventListener('loadedmetadata', onMeta);
  });
  radio.play().catch(function () {});
}
radio.addEventListener('ended', function () {
  current = (current + 1) % PLAYLIST.length;
  tuneIn(false);
});
tuneIn(true);

muteBtn.addEventListener('click', function () {
  radio.muted = !radio.muted;
  muteBtn.textContent = radio.muted ? "UNMUTE" : "MUTE";
  nowplaying.textContent = radio.muted ? "signal muted" : "NOW PLAYING: " + PLAYLIST[current].title;
  if (!radio.muted && radio.paused) radio.play().catch(function () {});
});
playBtn.addEventListener('click', function () {
  if (radio.paused) {
    radio.play().catch(function () {});
    playBtn.textContent = "PAUSE";
  } else {
    radio.pause();
    playBtn.textContent = "PLAY";
  }
});
</script>
</body>
</html>
